<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>KuliahPlanner</title>
    <script>
      (function() {
        try {
          const mode = localStorage.getItem('kuliahplanner_theme_mode') || 'system';
          const hex = localStorage.getItem('kuliahplanner_accent_color') || '#6366f1';
          const isMono = localStorage.getItem('kuliahplanner_is_monochrome') === 'true';
          const isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          const root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          var bgVal = '';
          if (isMono) {
            if (isDark) {
              bgVal = '#09090b';
              root.style.setProperty('--theme-bg', '#09090b');
              root.style.setProperty('--theme-surface', '#121215');
              root.style.setProperty('--theme-surface-subtle', '#1a1a1f');
              root.style.setProperty('--theme-border', '#2a2a32');
              root.style.setProperty('--theme-border-subtle', '#1e1e24');
              root.style.setProperty('--theme-text', '#f4f4f5');
              root.style.setProperty('--theme-muted', '#90909c');
              root.style.setProperty('--accent-primary', '#e4e4e7');
              root.style.setProperty('--accent-hover', '#f4f4f5');
              root.style.setProperty('--accent-text', '#e4e4e7');
              root.style.setProperty('--accent-subtle', 'rgba(244, 244, 245, 0.10)');
              root.style.setProperty('--accent-border', 'rgba(244, 244, 245, 0.20)');
              root.style.setProperty('--accent-contrast', '#09090b');
            } else {
              bgVal = '#f1f1f4';
              root.style.setProperty('--theme-bg', '#f1f1f4');
              root.style.setProperty('--theme-surface', '#fafafc');
              root.style.setProperty('--theme-surface-subtle', '#e2e2e7');
              root.style.setProperty('--theme-border', '#c6c6cf');
              root.style.setProperty('--theme-border-subtle', '#d8d8de');
              root.style.setProperty('--theme-text', '#121215');
              root.style.setProperty('--theme-muted', '#62626e');
              root.style.setProperty('--accent-primary', '#18181b');
              root.style.setProperty('--accent-hover', '#27272a');
              root.style.setProperty('--accent-text', '#18181b');
              root.style.setProperty('--accent-subtle', 'rgba(24, 24, 27, 0.08)');
              root.style.setProperty('--accent-border', 'rgba(24, 24, 27, 0.20)');
              root.style.setProperty('--accent-contrast', '#ffffff');
            }
          } else {
            let r = parseInt(hex.slice(1,3), 16) / 255;
            let g = parseInt(hex.slice(3,5), 16) / 255;
            let b = parseInt(hex.slice(5,7), 16) / 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = 0, s = 0, l = (max + min) / 2;
            if (max !== min) {
              let d = max - min;
              s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
              if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
              else if (max === g) h = (b - r) / d + 2;
              else h = (r - g) / d + 4;
              h = Math.round(h * 60);
            }
            let lum = 0.299 * (r * 255) + 0.587 * (g * 255) + 0.114 * (b * 255);
            let contrast = lum > 165 ? '#0f172a' : '#ffffff';
            if (isDark) {
              bgVal = 'hsl(' + h + ', 35%, 6.5%)';
              root.style.setProperty('--theme-bg', bgVal);
              root.style.setProperty('--theme-surface', 'hsl(' + h + ', 28%, 11.5%)');
              root.style.setProperty('--theme-surface-subtle', 'hsl(' + h + ', 24%, 17%)');
              root.style.setProperty('--theme-border', 'hsl(' + h + ', 18%, 26%)');
              root.style.setProperty('--theme-border-subtle', 'hsl(' + h + ', 20%, 18%)');
              root.style.setProperty('--theme-text', 'hsl(' + h + ', 15%, 95%)');
              root.style.setProperty('--theme-muted', 'hsl(' + h + ', 15%, 65%)');
              root.style.setProperty('--accent-primary', hex);
              root.style.setProperty('--accent-hover', 'color-mix(in srgb, ' + hex + ' 85%, white)');
              root.style.setProperty('--accent-text', 'hsl(' + h + ', 85%, 68%)');
              root.style.setProperty('--accent-subtle', 'color-mix(in srgb, ' + hex + ' 14%, transparent)');
              root.style.setProperty('--accent-border', 'color-mix(in srgb, ' + hex + ' 28%, transparent)');
              root.style.setProperty('--accent-contrast', contrast);
            } else {
              bgVal = 'hsl(' + h + ', 25%, 96%)';
              root.style.setProperty('--theme-bg', bgVal);
              root.style.setProperty('--theme-surface', 'hsl(' + h + ', 20%, 99%)');
              root.style.setProperty('--theme-surface-subtle', 'hsl(' + h + ', 22%, 92%)');
              root.style.setProperty('--theme-border', 'hsl(' + h + ', 18%, 84%)');
              root.style.setProperty('--theme-border-subtle', 'hsl(' + h + ', 15%, 89%)');
              root.style.setProperty('--theme-text', 'hsl(' + h + ', 30%, 12%)');
              root.style.setProperty('--theme-muted', 'hsl(' + h + ', 15%, 45%)');
              root.style.setProperty('--accent-primary', hex);
              root.style.setProperty('--accent-hover', 'color-mix(in srgb, ' + hex + ' 85%, black)');
              root.style.setProperty('--accent-text', 'hsl(' + h + ', 80%, 35%)');
              root.style.setProperty('--accent-subtle', 'color-mix(in srgb, ' + hex + ' 12%, transparent)');
              root.style.setProperty('--accent-border', 'color-mix(in srgb, ' + hex + ' 28%, transparent)');
              root.style.setProperty('--accent-contrast', contrast);
            }
          }
          root.style.backgroundColor = bgVal;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-theme-bg text-theme-text min-h-screen">
    <div id="root" class="min-h-screen bg-theme-bg"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
